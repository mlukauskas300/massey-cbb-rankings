name: Update Massey CBB Rankings

on:
  schedule:
    # Runs every day at 08:00 UTC (Adjust time/cron as needed)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lxml html5lib

      - name: Run Scraper Script
        run: python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add massey_cbb_rankings.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update CBB rankings" && git push)
